<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Diagonal color field: bottom-left muted sky blue -> top-right dusty coral-rose -->
    <linearGradient id="kagami-duotone" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#5B8FB2" />
      <stop offset="36%" stop-color="#7EB1D1" />
      <stop offset="52%" stop-color="#A8A1B4" />
      <stop offset="68%" stop-color="#D4928D" />
      <stop offset="100%" stop-color="#DF958C" />
    </linearGradient>

    <!-- Symmetrical 360-degree radial falloff mask so the halo diffuses evenly in all directions -->
    <radialGradient id="halo-falloff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="34%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.46" />
      <stop offset="84%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <mask id="halo-mask">
      <circle cx="32" cy="32" r="31" fill="url(#halo-falloff)" />
    </mask>

    <!-- Luminous soft center bloom -->
    <radialGradient id="kagami-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="48%" stop-color="#FFFDFB" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#FFFDFB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Evenly radiating duotone halo -->
  <circle cx="32" cy="32" r="31" fill="url(#kagami-duotone)" mask="url(#halo-mask)" />

  <!-- Subtle concentric diffusion rings -->
  <circle cx="32" cy="32" r="21" stroke="#FFFDFB" stroke-opacity="0.24" stroke-width="0.9" />
  <circle cx="32" cy="32" r="13.5" stroke="#FFFDFB" stroke-opacity="0.36" stroke-width="0.9" />

  <!-- Luminous center -->
  <circle cx="32" cy="32" r="11" fill="url(#kagami-core)" />
  <circle cx="32" cy="32" r="4.2" fill="#FFFFFF" />
</svg>
