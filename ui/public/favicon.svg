<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Mirror background: a lavender gradient lit from the top left, from the same family as #9b82ff -->
    <linearGradient id="kagami-face" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#a893ff" />
      <stop offset="1" stop-color="#8b71ff" />
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="11.25" fill="url(#kagami-face)" />
  <!-- The ring keeps its original geometry and is scaled down to leave a margin around the background.
       The stroke colour has to be hardcoded, because in a standalone SVG document currentColor
       degrades to black. -->
  <g
    transform="translate(12 12) scale(0.82) translate(-12 -12)"
    stroke="#ffffff"
    stroke-width="2.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M3.6 15h10.55" />
    <path d="M6.551 4.938l3.26 10.034" />
    <path d="M17.032 4.636l-8.535 6.201" />
    <path d="M20.559 14.51l-8.535 -6.201" />
    <path d="M12.257 20.916l3.261 -10.034" />
  </g>
</svg>
